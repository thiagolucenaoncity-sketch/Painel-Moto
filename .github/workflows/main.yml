name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Gerar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK com a versão
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "RAVO_v1.1.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ravo-apk
          path: RAVO_v*.apk
