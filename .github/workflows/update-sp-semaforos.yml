name: Atualizar semaforos SP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_sp_traffic_signals.py
      - scripts/fuse_sp_traffic_signals.py
      - scripts/import_geosampa_signals.py
      - tests/test_fuse_traffic_signals.py
      - data/traffic_sources/**
      - .github/workflows/update-sp-semaforos.yml
  schedule:
    # Aproximadamente quinzenal, nos dias 1 e 16 de cada mês (UTC).
    - cron: '13 9 1,16 * *'

permissions:
  contents: write

concurrency:
  group: update-sp-semaforos
  cancel-in-progress: false

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar leitor OSM PBF
        run: python -m pip install --disable-pip-version-check osmium
      - name: Testar algoritmo de fusao de dados
        run: python -m unittest discover -s tests -p 'test_fuse_traffic_signals.py' -v
      - name: Importar GeoSampa como segunda fonte independente se disponivel
        run: python scripts/import_geosampa_signals.py
      - name: Consultar estado e consolidar dados reais
        run: python scripts/generate_sp_traffic_signals.py
      - name: Salvar a base estadual no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/roadalerts/sp_semaforos.csv data/traffic_quality/sp_semaforos_report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: consolidar semaforos SP offline e auditoria de fontes"
            # Uma compilação ou alteração de código pode chegar à main durante
            # o processamento do PBF. Reaplica o commit sem forçar o histórico.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            echo "Nao foi possivel publicar sem conflito apos 3 tentativas" >&2
            exit 1
          else
            echo "Base sem alteracoes"
          fi
